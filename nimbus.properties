# Nimbus project configuration. Commit this file — your team shares one
# config. Profiles override per-environment with %name. prefix; %ci. is the
# default profile when nimbus runs in CI (e.g. NIMBUS_PROFILE=ci).
#
# Full reference: https://testnimbus.dev/docs/configuration

# ─── Managed packages ──────────────────────────────────────────────────────
#
# If your project references managed packages (Nebula, fflib, apex-rollup,
# nebula-logger, etc.), declare them here so Nimbus treats their types as
# opaque instead of warning on every reference. You can also add per-class
# stub files under stubs/ for fine-grained control — see stubs/README.md.
#
# nimbus.stubs.namespaces=Nebula,fflib,al

# ─── Governor limits ───────────────────────────────────────────────────────
#
# Nimbus's own default — with this line left commented out, as scaffolded —
# is 'strict' (throws a real Apex LimitException, like Salesforce). Uncomment
# the line below for a friendlier local-dev starting point that only warns;
# tighten it back to strict in CI with the profile override further down.
#
# Modes:
#   warn    — track usage, print a warning when limits are hit
#   strict  (Nimbus's default) — throw a real Apex LimitException, like Salesforce
#   off     — disable enforcement entirely (fastest, least faithful)
#
# nimbus.governor.mode=warn

# ─── Org features ──────────────────────────────────────────────────────────
#
# If your org uses MultiCurrency or PersonAccounts, declare it here so
# Nimbus mirrors the schema additions Salesforce makes when these are on
# (CurrencyIsoCode field on every SObject, Account.IsPersonAccount, etc.).
#
# nimbus.org.features=MultiCurrency

# ─── Seed data (optional) ──────────────────────────────────────────────────
#
# Custom Settings, custom labels, list views, and Sites that exist in your
# org but aren't in the repo metadata — declare them here so tests that
# depend on them have data to read.
#
# nimbus.seed.label.MyLabel=Some value
# nimbus.seed.list-view.<Object>.<DeveloperName>=<Label>
#
# seed.record seeds LIST CUSTOM SETTINGS only. The rows are returned by
# <Setting>__c.getAll() / getInstance() during tests; they are not inserted
# into the database, so SOQL against the setting's table still starts empty
# and each test stays isolated. Naming any other SObject here does nothing —
# Nimbus warns about it rather than failing.
#
# nimbus.seed.record.<Setting>__c.<Name>=Field1=value,Field2=value
#
# seed.row is the opposite: it inserts a REAL database row, for org-resident
# objects Nimbus has no dedicated seeder for (OrgWideEmailAddress, an org-only
# PermissionSetGroup, BusinessHours, Holiday, ...). The <Name> half of the key
# fills the object's DeveloperName or Name; everything else comes from the
# value. Rows are seeded once per environment, and a test that deletes one
# still rolls back like any other DML.
#
# nimbus.seed.row.OrgWideEmailAddress.Support=Address=noreply@acme.com
# nimbus.seed.row.PermissionSetGroup.For_Everyone=MasterLabel=For Everyone

# ─── CI profile (overrides the above when NIMBUS_PROFILE=ci) ────────────────
#
# Tighter governor enforcement in CI catches "passed locally, would fail in
# Salesforce" issues before merge — useful if you uncommented
# nimbus.governor.mode=warn above for faster local iteration. Nimbus's own
# default is already 'strict' everywhere this override is not needed.
#
# %ci.nimbus.governor.mode=strict
# %ci.nimbus.test.parallel=4

# XFTY test-support classes assume Person Accounts (built-in PersonAccount RT).
nimbus.org.features=PersonAccount

# ─── Org-only tests ────────────────────────────────────────────────────────
#
# test-support/main/default/classes/orgonly/ holds tests that need a real org's
# schema / query semantics (Person Accounts, real Profiles / UserRoles, real
# record-type describe + query counting). They pass on a scratch org; the local
# runtime fakes those, so exclude them from `nimbus test`.
nimbus.test.exclude=**/orgonly/**
