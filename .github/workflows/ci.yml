name: CI

on:
  push:
    branches: [master, 4.0-beta]
  pull_request:
    branches: [master, 4.0-beta]

# Serialise scratch org creation so parallel runs don't exhaust the Dev Hub's
# active scratch org allocation.
concurrency:
  group: scratch-org-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  static-checks:
    name: Docs and style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Doc examples are backed by a runnable test
        run: python3 scripts/verify-doc-examples.py

      - name: Every doc link resolves
        run: python3 scripts/verify-doc-links.py

      - name: Apex style (whole-tree safety + changed-file rules)
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="HEAD~1"
          fi
          echo "comparing against $BASE"
          python3 scripts/check-apex-style.py --changed "$BASE"

  apex-tests:
    name: Deploy and run Apex tests
    runs-on: ubuntu-latest
    env:
      DEVHUB_SFDX_AUTH_URL: ${{ secrets.DEVHUB_SFDX_AUTH_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the Salesforce CLI
        run: npm install --global @salesforce/cli@latest

      - name: Authenticate the Dev Hub
        run: |
          if [ -z "$DEVHUB_SFDX_AUTH_URL" ]; then
            echo "::error::The DEVHUB_SFDX_AUTH_URL repository secret is not set. See docs/contribute/ci.md."
            exit 1
          fi
          printf '%s' "$DEVHUB_SFDX_AUTH_URL" > ./devhub-auth.txt
          sf org login sfdx-url --sfdx-url-file ./devhub-auth.txt --set-default-dev-hub --alias devhub
          rm -f ./devhub-auth.txt

      - name: Create a scratch org
        run: sf org create scratch --definition-file config/project-scratch-def.json --alias ci --set-default --duration-days 1 --wait 10

      - name: Deploy the source
        run: sf project deploy start --wait 20

      - name: Run all local Apex tests
        run: sf apex run test --test-level RunLocalTests --code-coverage --result-format human --wait 20

      - name: Delete the scratch org
        if: always()
        run: sf org delete scratch --target-org ci --no-prompt || true
